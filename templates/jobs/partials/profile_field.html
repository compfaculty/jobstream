<div class="profile-field{% if field.field.widget.input_type == 'checkbox' %} profile-check{% endif %}">
{{ field.errors }}
{% if field.field.widget.input_type == 'checkbox' %}{{ field }} {{ field.label_tag }}{% else %}{{ field.label_tag }}{% if field.field.required %}<span class="muted">Required</span>{% endif %}{{ field }}{% endif %}
{% if field.help_text %}<p class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
