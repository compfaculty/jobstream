# Standalone sink; deliberately does not inherit .env or application services.
services:
  mailpit:
    image: axllent/mailpit:v1.30.4@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /tmp/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
    networks: [sink]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
networks:
  sink:
    # Internal networks suppress published ports on this Docker Desktop version.
    # Disable outbound masquerading while preserving localhost port forwarding.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
