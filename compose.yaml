x-app: &app
  image: jobstream:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://jobstream:local-only@db:5432/jobstream
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://storage:4566
    S3_BUCKET: jobstream-private
    AWS_ACCESS_KEY_ID: local-storage
    AWS_SECRET_ACCESS_KEY: local-storage-password
    INFINITY_URL: http://infinity:8091
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},web
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    storage: {condition: service_healthy}
  init: true
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 768m
  pids_limit: 256
services:
  infinity:
    profiles: ["infinity"]
    image: jobstream-infinity:local
    build: services/infinity-agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INFINITY_PROVIDER: ${INFINITY_PROVIDER:-openai}
      INFINITY_REASONING_EFFORT: ${INFINITY_REASONING_EFFORT:-low}
      INFINITY_SERVICE_TOKEN: ${INFINITY_SERVICE_TOKEN:-}
      INFINITY_DATABASE_URL: ${INFINITY_DATABASE_URL:-}
      INFINITY_DJANGO_URL: http://web:8000
      INFINITY_BIND: 0.0.0.0:8091
      RUST_LOG: info
    depends_on:
      db: {condition: service_healthy}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
  web:
    <<: *app
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60", "--no-control-socket"]
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=celery", "--concurrency=1"]
  ingestion-worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=ingestion", "--concurrency=2"]
  preparation-worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=preparation", "--concurrency=2"]
  delivery-worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=delivery", "--concurrency=1"]
  browser-worker:
    <<: *app
    image: jobstream-browser:local
    build: {context: ., target: browser}
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=browser-delivery", "--concurrency=1"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    shm_size: 256m
    mem_limit: 1536m
    pids_limit: 512
    security_opt: ["no-new-privileges:true", "seccomp=./deploy/chromium-seccomp.json"]
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: jobstream, POSTGRES_PASSWORD: local-only, POSTGRES_DB: jobstream}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U jobstream"], interval: 3s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20}
  storage:
    image: localstack/localstack:4.8.1@sha256:8c9756bddc44625cd6e890f5e4bcc29b045eebe108b268482b848f4f832ec153
    environment: {SERVICES: s3, AWS_DEFAULT_REGION: us-east-1}
    ports: ["127.0.0.1:4566:4566"]
    volumes: ["./scripts/init-storage.sh:/etc/localstack/init/ready.d/init-storage.sh:ro"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket jobstream-private"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres:
  redis:
