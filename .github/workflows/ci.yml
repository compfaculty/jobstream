name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: jobstream, POSTGRES_PASSWORD: local-only, POSTGRES_DB: jobstream}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U jobstream" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEBUG: '1'
      DATABASE_URL: postgresql://jobstream:local-only@127.0.0.1:5432/jobstream
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: {version: '0.13.6', python-version: '3.14'}
      - run: uv sync --frozen
      - run: uv run python manage.py collectstatic --noinput
      - run: make check
      - run: make check-deploy
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo build --locked --manifest-path services/infinity-agent/Cargo.toml
      - run: cargo test --locked --manifest-path services/infinity-agent/Cargo.toml
      - run: make infinity-check
      - run: uv run pytest -m 'not browser' --cov=jobs --cov-report=json --cov-report=term-missing
        env: {INFINITY_INTEGRATION: '1', OBSERVABILITY_PROCESS_TESTS: '1'}
      - run: uv run python scripts/check_coverage.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
      - run: uv run python manage.py spectacular --file /tmp/openapi.yml --validate --fail-on-warn
      - run: uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt --quiet && uv run pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.json
            test-results/
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: web, context: ., target: default}
          - {name: browser, context: ., target: browser}
          - {name: infinity, context: services/infinity-agent, target: runtime}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.name == 'web'
        run: python3 scripts/scan_secrets.py
      - run: docker build --target ${{ matrix.target }} -t jobstream-${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}
      - if: matrix.name == 'web'
        name: Validate monitoring configuration and alert rules
        run: |
          docker tag jobstream-web:${{ github.sha }} jobstream:local
          cp .env.example .env
          python3 scripts/setup_monitoring.py
          make monitoring-check
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: jobstream-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
  rust-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: services/infinity-agent
          scanners: vuln
          skip-dirs: services/infinity-agent/target
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
